name: Playwright Tests  # Display name shown in GitHub's Actions tab

on:   # WHEN this workflow runs
    push:
        branches:  # runs on every push to main
            - main   
    pull_request:
        branches: # runs on every PR targeting main
            - main  
jobs:

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:

            - name: checkout repository
              uses: actions/checkout@v6
              
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                python-version: "3.14.7"

            - name: Install dependencies
              run: | 
               python -m pip install --upgrade pip
               pip install -r requirements.txt
            
            - name: Install Playwright
              run: |
               python -m playwright install --with-deps

            - name: Generate SauceDemo Authenticate state
              env:
                 STANDARD_USERNAME: ${{secrets.STANDARD_USERNAME}}
                 STANDARD_PASSWORD: ${{secrets.STANDARD_PASSWORD}}
              run: python -m tests.auth.setup_auth

            - name: Start Shopsphere API
              run: |
               nohup python api/app.py > shopsphere.log 2>&1 &
               for i in {1..30}; do
                  if curl -fsS http://127.0.0.1:5000/health; then
                     break
                  fi
                   sleep 2
                done
                curl -fsS http://127.0.0.1:5000/health


            
            - name: Run Tests
              env:
                SHOPSPHERE_API_URL: http://127.0.0.1:5000
                SHOPSPHERE_UI_URL: http://127.0.0.1:5000
                STANDARD_USERNAME: ${{secrets.STANDARD_USERNAME}}
                STANDARD_PASSWORD: ${{secrets.STANDARD_PASSWORD}}
              run:
                pytest

            - name: Upload Playwright artifacts
              if: ${{cancelled() || failure()}}
              uses:
                 actions/upload-artifact@v4
              with:
                 name: playwright-test-results
                 path: test-results/

