name: ShopSphere Automation Tests
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
jobs:
    api_and_ui-tests:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repository
              uses: actions/checkout@v4

            - name: Set up python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            
            - name: Install Dependencies
              run: |
               python -m pip install --upgrade pip
               pip install -r requirements.txt
               pip install -r api/requirements.txt
               python -m playwright install --with-deps chromium

            - name: Generate SauceDemo Authenticate state
              env:
                 STANDARD_USERNAME: ${{secrets.STANDARD_USERNAME}}
                 STANDARD_PASSWORD: ${{secrets.STANDARD_PASSWORD}}
              run: python -m tests.auth.setup_auth

            - name: Build Shopsphere Docker image
              run: docker build -t shopsphere-api:1.0 .

            - name: Start Shopsphere container
              shell: bash
              run: |
               docker run -d \
                --name shopsphere-api \
                -p 5001:5000 \
                shopsphere-api:1.0
               for i in {1..30}; do
                   if curl -fsS http://127.0.0.1:5001/health; then
                    echo "ShopSphere Docker Container is ready"
                    exit 0
                   fi
                    sleep 2
                done
                echo "ShopSphere container failed to start"
                docker logs shopsphere-api
                exit 1
            #       if curl -fsS http://127.0.0.1:5000/health; then
            
            # - name: Start Shopsphere API  
            #   run: |
            #    nohup python api/app.py > shopsphere.log 2>&1 &
            #    for i in {1..30}; do
            #       if curl -fsS http://127.0.0.1:5000/health; then
            #          break
            #       fi
            #        sleep 2
            #     done
            #     curl -fsS http://127.0.0.1:5000/health

            - name: Run ShopSphere API tests
              env: 
                # SHOPSPHERE_API_URL: http://127.0.0.1:5000
                SHOPSPHERE_API_URL: http://127.0.0.1:5001 # for Docker test
              run: |
               pytest tests/api/test_shopsphere_api.py -v \
               -v \
               --alluredir=allure-results \
               --clean-alluredir
            
            - name: Run Shopsphere Integration tests
              env:
                #SHOPSPHERE_API_URL: http://127.0.0.1:5000
                #SHOPSPHERE_UI_URL: http://127.0.0.1:5000
                SHOPSPHERE_API_URL: http://127.0.0.1:5001
                SHOPSPHERE_UI_URL: http://127.0.0.1:5001
              run: |
               pytest tests/integration/ -v \
               -v \
               --alluredir=allure-results \
               --clean-alluredir

            - name: Set up Node.js for Allure
              if: always()
              uses: actions/setup-node@v4
              with:
                node-version: 22

            - name: Generate Allure HTML report
              if: always()
              shell: bash
              run: |
               if [ -d allure-results ] && \
                  [-n "$(find allure-results -type f -print -quit)"]: then
                   npx --yes allure generate allure-results
               else
                 echo "No Allure results found; skipping report generation."

                fi

            - name: Upload Allure HTML report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: allure-html-report
                path: allure-report/
                if-no-files-found: warn
                retention-days: 14
               
            - name: Upload Allure results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: allure-results
                path: allure-results/
                if-no-files-found: warn
                retention-days: 14

