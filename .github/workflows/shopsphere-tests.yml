name: ShopSphere Automation Tests
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
jobs:
    api_and_ui-tests:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repository
              uses: actions/checkout@v4

            - name: Set up python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            
            - name: Install Dependencies
              run: |
               python -m pip install --upgrade pip
               pip install -r requirements.txt
               pip install -r api/requirements.txt
               python -m playwright install --with-deps chromium

            - name: Generate SauceDemo Authenticate state
              env:
                 STANDARD_USERNAME: ${{secrets.STANDARD_USERNAME}}
                 STANDARD_PASSWORD: ${{secrets.STANDARD_PASSWORD}}
              run: python -m tests.auth.setup_auth
            
            - name: Start Shopsphere API
              run: |
               nohup python api/app.py > shopsphere.log 2>&1 &
               for i in {1..30}; do
                  if curl -fsS http://127.0.0.1:5000/health; then
                     break
                  fi
                   sleep 2
                done
                curl -fsS http://127.0.0.1:5000/health

            - name: Run ShopSphere API tests
              env: 
                SHOPSPHERE_API_URL: http://127.0.0.1:5000
              run: |
               pytest tests/api/test_shopsphere_api.py -v
            
            - name: Run Shopsphere Integration tests
              env:
                SHOPSPHERE_API_URL: http://127.0.0.1:5000
                SHOPSPHERE_UI_URL: http://127.0.0.1:5000
              run: |
               pytest tests/integration/ -v
               

